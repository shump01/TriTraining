name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    # Dummy values so the env validator (src/env.ts) and `next build` succeed.
    # No real secrets, no database connection happens at build time.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/tritrainer
      DIRECT_URL: postgresql://user:pass@localhost:5432/tritrainer
      NEXTAUTH_URL: http://localhost:3000
      STRAVA_CLIENT_ID: ci-client-id
      STRAVA_CLIENT_SECRET: ci-client-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate CI-only secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on high/critical advisories in what actually SHIPS (--omit=dev).
      # Build/lint-only tooling is audited separately below without failing the
      # job: a DoS in eslint's glob matcher is a nuisance on a developer's
      # machine, not a hole in the running service, and letting it hold the
      # gate red is how a red gate stops being read at all.
      - run: npm run audit
      - name: Dev-tooling advisories (informational)
        if: always()
        run: npm audit --audit-level=high || true
